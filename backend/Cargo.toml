[package]
name = "hf-plugin-aireplay"
version = "0.1.1"
edition = "2021"
description = "HaloForge built-in AI Replay plugin (backend)"

[lib]
name = "hf_plugin_aireplay"
crate-type = ["cdylib", "rlib"]

[dependencies]
hf-plugin-api = { package = "haloforge-plugin-api", version = "0.1.1" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"

[workspace]
